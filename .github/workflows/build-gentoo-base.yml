name: build-gentoo-base

# Each job saves a complete or partial image before exiting. Rerunning failed
# jobs resumes installed packages; earlier successful stages are reused.
on:
  workflow_dispatch:
    inputs:
      checkpoint_epoch:
        description: 'Recovery series (empty uses YYYYMM; change to refresh the package snapshot)'
        required: false
        type: string
  schedule:
    - cron: "0 3 1 * *"

concurrency:
  group: gentoo-sdk-checkpoints
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  configured:
    uses: ./.github/workflows/gentoo-sdk-stage.yml
    with:
      phase: configured
      epoch: ${{ inputs.checkpoint_epoch || '' }}
  toolchain:
    needs: [configured]
    uses: ./.github/workflows/gentoo-sdk-stage.yml
    with:
      phase: toolchain
      epoch: ${{ needs.configured.outputs.epoch }}
  qtbase:
    needs: [configured, toolchain]
    uses: ./.github/workflows/gentoo-sdk-stage.yml
    with:
      phase: qtbase
      epoch: ${{ needs.configured.outputs.epoch }}
  qttools:
    needs: [configured, qtbase]
    uses: ./.github/workflows/gentoo-sdk-stage.yml
    with:
      phase: qttools
      epoch: ${{ needs.configured.outputs.epoch }}
  frameworks:
    needs: [configured, qttools]
    uses: ./.github/workflows/gentoo-sdk-stage.yml
    with:
      phase: frameworks
      epoch: ${{ needs.configured.outputs.epoch }}
  plasma:
    needs: [configured, frameworks]
    uses: ./.github/workflows/gentoo-sdk-stage.yml
    with:
      phase: plasma
      epoch: ${{ needs.configured.outputs.epoch }}
  verify:
    needs: [configured, plasma]
    uses: ./.github/workflows/gentoo-sdk-stage.yml
    with:
      phase: verify
      epoch: ${{ needs.configured.outputs.epoch }}
