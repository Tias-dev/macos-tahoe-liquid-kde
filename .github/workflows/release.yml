name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify version-bound, reviewed screenshots
        run: python3 release-screenshots verify --ref "$GITHUB_SHA"
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 release-screenshots publish --ref "$GITHUB_SHA"
