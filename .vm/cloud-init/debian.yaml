#cloud-config
# Debian testing guest from the official Forky generic cloud image.
# Install a normal Plasma desktop; the theme installer resolves its own
# build dependencies. Keep the host repository read-only.

users:
  - name: tester
    gecos: VM Tester
    groups: [sudo, users]
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    lock_passwd: false
    passwd: "$6$mttkdevm$QqkApILBUIQ5/AXpjsoSJGqAlLm1MI2vTZCDEHNYGb.jnyXsjGeVTq3pOCi4JRqh5r.D0GRRHtDiX6Xsb8fcu/"

ssh_pwauth: true
disable_root: true
chpasswd:
  expire: false
  users:
    - name: tester
      password: tester
      type: text

growpart:
  mode: auto
  devices: ["/"]

resize_rootfs: true
package_update: false
package_upgrade: false

bootcmd:
  - usermod --password "$(openssl passwd -6 -salt mttkdevm tester)" tester 2>/dev/null || true

write_files:
  - path: /usr/local/bin/mttkde-provision.sh
    permissions: "0755"
    content: |
      #!/bin/bash
      set -euo pipefail
      exec > >(tee -a /var/log/mttkde-provision.log) 2>&1

      if [[ -f /var/lib/mttkde/provisioned ]]; then
          exit 0
      fi

      select_plasma_session() {
          local candidate
          for candidate in plasma.desktop plasmawayland.desktop plasmax11.desktop; do
              if [[ -f "/usr/share/wayland-sessions/${candidate}" ]] || \
                 [[ -f "/usr/share/xsessions/${candidate}" ]]; then
                  printf '%s\n' "$candidate"
                  return 0
              fi
          done
          printf 'plasma.desktop\n'
      }

      mkdir -p /var/lib/mttkde /home/tester/.config/autostart

      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y \
          kde-plasma-desktop sddm openssh-server sudo \
          python3-pyqt6 python3-pyqt6.qtqml \
          qml6-module-org-kde-plasma-plasma5support \
          konsole dolphin firefox-esr kde-spectacle qdbus-qt6 qmake6 \
          dbus-user-session xwayland rsync ca-certificates curl

      systemctl enable ssh
      systemctl daemon-reload || true
      systemctl set-default graphical.target

      session_name="$(select_plasma_session)"
      if [[ ! -f /usr/lib/systemd/system/sddm.service ]]; then
          echo "SDDM unit not found" >&2
          exit 1
      fi
      mkdir -p /etc/sddm.conf.d
      cat > /etc/sddm.conf.d/autologin.conf <<EOF
      [Autologin]
      User=tester
      Session=${session_name}
      EOF
      systemctl enable sddm.service
      printf '%s\n' /usr/bin/sddm > /etc/X11/default-display-manager

      mkdir -p /home/tester/repo /home/tester/Desktop
      modprobe 9p || true
      modprobe 9pnet_virtio || true
      grep -q '^repo /home/tester/repo' /etc/fstab \
          || echo 'repo /home/tester/repo 9p trans=virtio,version=9p2000.L,msize=262144,ro,nofail 0 0' >> /etc/fstab

      cat > /usr/local/bin/mttkde-vm-installer <<'EOF'
      #!/bin/bash
      set -euo pipefail
      source_dir=/home/tester/repo
      worktree=/home/tester/macos-tahoe-liquid-kde
      for _attempt in $(seq 1 30); do
          [[ -f "$source_dir/install" ]] && break
          sleep 1
      done
      [[ -f "$source_dir/install" ]] || exit 1
      mkdir -p "$worktree"
      rsync -a --delete \
          --exclude=.git --exclude=.vm --exclude=build \
          "$source_dir/" "$worktree/"
      cd "$worktree"
      exec ./installer
      EOF
      chmod 0755 /usr/local/bin/mttkde-vm-installer

      cat > /home/tester/Desktop/macos-tahoe-liquid-kde.desktop <<'EOF'
      [Desktop Entry]
      Type=Link
      Name=macos-tahoe-liquid-kde — writable VM copy
      Icon=folder
      URL=file:///home/tester/macos-tahoe-liquid-kde
      EOF

      cat > /home/tester/.config/autostart/mttkde-installer.desktop <<'EOF'
      [Desktop Entry]
      Type=Application
      Name=macos-tahoe-liquid-kde Installer
      Comment=Opens the macOS Tahoe installer UI
      Exec=bash -lc 'sleep 8; exec /usr/local/bin/mttkde-vm-installer'
      Icon=system-software-install
      Terminal=false
      X-KDE-autostart-phase=2
      OnlyShowIn=KDE;
      EOF

      chown -R tester:tester \
          /home/tester/repo /home/tester/Desktop /home/tester/.config

      cat > /etc/profile.d/mttkde-vm-progress.sh <<'EOF'
      #!/bin/sh
      [ "$(id -un)" = "tester" ] || return 0
      case "$(tty)" in /dev/tty*) ;; *) return 0 ;; esac
      [ -f /var/lib/mttkde/provisioned ] && return 0
      [ -f /var/log/mttkde-provision.log ] || return 0
      clear
      echo "=== mttkde-vm: cloud-init is installing Debian Plasma. ==="
      echo "=== Tail of /var/log/mttkde-provision.log below.  ==="
      echo "=== The VM will REBOOT into Plasma when finished. ==="
      echo "=== (Ctrl-C to drop to shell; re-login to resume.) ==="
      echo
      tail -F /var/log/mttkde-provision.log
      EOF
      chmod 0644 /etc/profile.d/mttkde-vm-progress.sh

      touch /var/lib/mttkde/provisioned
      systemctl --no-block reboot

runcmd:
  - systemctl enable --now ssh || true
  - /usr/local/bin/mttkde-provision.sh
